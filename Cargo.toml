[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
crossbeam-channel = "0.5"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 1
