[package]
name = "deck-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[[bin]]
name = "macropad-studio"
path = "src/main.rs"
[dependencies]
deck-domain = { path = "../deck-domain" }
deck-runtime = { path = "../deck-runtime" }
deck-platform = { path = "../deck-platform" }
anyhow.workspace = true
serde_json.workspace = true
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
