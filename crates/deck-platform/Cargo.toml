[package]
name = "deck-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
deck-domain = { path = "../deck-domain" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_System_Memory"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
